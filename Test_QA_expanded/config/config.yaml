## valuse takes from ammeter-test-specification.md
testing:
  host: "localhost" #host to run on
  timeout_second: 4.0 #response timeout
  sampling:
    measurements_count: 10
    total_duration_seconds: 2.0
    sampling_frequency_hz: 5.0

ammeters:
  greenlee:
    port: 5001
    command: "MEASURE_GREENLEE -get_measurement"
  entes:
    port: 5002
    command: "MEASURE_ENTES -get_data"
  circutor:
    port: 5003
    command: "MEASURE_CIRCUTOR -get_measurement -current"

analysis:
  statistical_metrics: #from result analysis
    - mean
    - median
    - std_dev
    - min
    - max
  visualization:
    enabled: false #do not install graffics
    plot_types: []

result_management:
  output_dir: "results"
